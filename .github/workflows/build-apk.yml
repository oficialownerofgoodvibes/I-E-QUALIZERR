name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK debug
        run: |
          S=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$S" ]; then
            echo "No hay settings.gradle.kts en el repo. Archivos:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          cd "$(dirname "$S")"
          echo "Proyecto en: $(pwd)"
          gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EqForge-debug-apk
          path: '**/app-debug.apk'
